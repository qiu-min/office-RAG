llm:
  provider: "deepseek"
  model: "deepseek-v4-flash"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "ollama"
  model: "nomic-embed-text-v2-moe:latest"
  dimensions: 768

vision_llm:
  enabled: false
  provider: "ollama"
  model: "qwen2.5vl:3b"
  max_image_size: 2048
  base_url: "http://localhost:11434"

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: true
  provider: "cross_encoder"
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 100
  chunk_refiner:
    use_llm: true
  metadata_enricher:
    use_llm: true
